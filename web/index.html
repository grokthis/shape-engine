<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape OS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

/* Loading screen */
#loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 24px; }
#loading h1 { font-size: 28px; font-weight: 300; letter-spacing: 4px; }
#loading .status { font-size: 14px; color: #888; }
#loading .bar { width: 200px; height: 2px; background: #222; border-radius: 1px; overflow: hidden; }
#loading .bar-fill { height: 100%; background: #4af; width: 0%; transition: width 0.3s; }

/* Username prompt */
#prompt { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 24px; }
#prompt h2 { font-size: 20px; font-weight: 300; }
#prompt input { background: #111; border: 1px solid #333; color: #e0e0e0; padding: 12px 20px; font-size: 16px; border-radius: 4px; outline: none; width: 280px; text-align: center; }
#prompt input:focus { border-color: #4af; }
#prompt .hint { font-size: 12px; color: #666; }

/* OS frame */
#os-frame { display: none; width: 100%; height: 100vh; border: none; }

/* Idle warning */
#idle-bar { display: none; position: fixed; top: 0; left: 0; right: 0; background: #1a1a2e; color: #888; font-size: 12px; padding: 4px 12px; text-align: center; z-index: 9999; }
</style>
</head>
<body>

<div id="loading">
  <h1>SHAPE OS</h1>
  <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
  <div class="status" id="load-status">loading engine...</div>
</div>

<div id="prompt">
  <h2>enter a username</h2>
  <input id="username" type="text" placeholder="guest" autocomplete="off" autofocus>
  <div class="hint">sandbox resets after 30 minutes of idle</div>
</div>

<iframe id="os-frame"></iframe>
<div id="idle-bar"></div>

<script src="shape-engine.js"></script>
<script>
(async function() {
  const barFill = document.getElementById('bar-fill');
  const loadStatus = document.getElementById('load-status');
  const loading = document.getElementById('loading');
  const prompt = document.getElementById('prompt');
  const usernameInput = document.getElementById('username');
  const osFrame = document.getElementById('os-frame');
  const idleBar = document.getElementById('idle-bar');

  let engine;

  // Boot
  barFill.style.width = '30%';
  loadStatus.textContent = 'loading shapes...';

  try {
    engine = await bootShapeOS();
  } catch(e) {
    loadStatus.textContent = 'error: ' + e.message;
    console.error(e);
    return;
  }

  barFill.style.width = '100%';
  const sc = engine.shapeCount();
  loadStatus.textContent = sc + ' shapes loaded';
  console.log('Shape OS: ' + sc + ' shapes');
  for (const id of ['os.route.page.desktop', 'os.handler.page.desktop']) {
    const s = engine.getShape(id);
    console.log(id + ': ' + (s ? 'OK (' + s.character.content.length + ' chars)' : 'MISSING'));
  }
  let rc = 0;
  for (const s of engine.allShapes()) { if (s.character.dimensions.type === 'route') { console.log('route: ' + s.id + ' path=' + s.character.dimensions.path); rc++; } }
  console.log(rc + ' routes');

  // Show username prompt
  setTimeout(() => {
    loading.style.display = 'none';
    prompt.style.display = 'flex';
    usernameInput.focus();
  }, 400);

  // Enter to start
  usernameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const username = usernameInput.value.trim() || 'guest';
      startOS(username);
    }
  });

  function handleRequest(method, path, body) {
    // Parse query string from path
    let queryStr = '';
    const qi = path.indexOf('?');
    if (qi >= 0) { queryStr = path.slice(qi + 1); path = path.slice(0, qi); }

    // Find matching route shape
    let bestRoute = null, bestLen = 0;
    for (const s of engine.allShapes()) {
      if (s.character.dimensions.type !== 'route') continue;
      const rm = s.character.dimensions.method;
      if (rm && rm.toUpperCase() !== method.toUpperCase()) continue;
      const rp = s.character.dimensions.path;
      if (rp === path) { bestRoute = s; break; }
      if (matchPattern(rp, path)) {
        const pl = rp.split('/').length;
        if (pl > bestLen) { bestRoute = s; bestLen = pl; }
      }
    }

    if (!bestRoute) return { status: 404, contentType: 'text/plain', body: 'not found' };

    const handlerId = bestRoute.character.dimensions.handler;
    if (!handlerId) return { status: 500, contentType: 'text/plain', body: 'route has no handler' };

    const handler = engine.getShape(handlerId);
    if (!handler) return { status: 500, contentType: 'text/plain', body: 'handler not found: ' + handlerId };

    // Build scope
    const scope = { ...bestRoute.character.dimensions, method, path, query: queryStr, body };
    for (const param of queryStr.split('&')) {
      if (!param) continue;
      const [k, v] = param.split('=');
      scope['q_' + k] = v || '';
    }
    extractPathParams(bestRoute.character.dimensions.path, path, scope);

    try {
      const prog = parse(handler.character.content);
      const ev = createEvaluator(engine);
      for (const [k, v] of Object.entries(scope)) ev.setScope(k, v);
      ev.run(prog);
      const ct = bestRoute.character.dimensions.content_type || 'text/html; charset=utf-8';
      return { status: 200, contentType: ct, body: ev.getOutput() };
    } catch(e) {
      return { status: 500, contentType: 'text/plain', body: 'eval error: ' + e.message };
    }
  }

  function execShell(line) {
    line = line.trim();
    if (!line) return '';

    // Pipe support
    if (line.includes(' | ')) {
      const segments = line.split(' | ');
      let output = '';
      for (let seg of segments) {
        seg = seg.trim();
        if (output) seg = seg + ' ' + output;
        output = execShell(seg);
      }
      return output;
    }

    const parts = line.split(/\s+/);
    const cmd = parts[0];
    const argList = parts.slice(1);

    const prefixShape = engine.getShape('os.session.shell.prefix');
    const prefix = prefixShape ? prefixShape.character.content : '';
    const homeShape = engine.getShape('os.config.shell.home');
    const home = homeShape ? homeShape.character.content : '';

    const cmdShape = engine.getShape('os.shell.cmd.' + cmd);
    if (cmdShape && cmdShape.character.dimensions.type === 'exec') {
      const scope = { args: argList.join(' '), line, cmd, prefix, home };
      argList.forEach((a, i) => scope['arg' + i] = a);
      try {
        const prog = parse(cmdShape.character.content);
        const ev = createEvaluator(engine);
        for (const [k, v] of Object.entries(scope)) ev.setScope(k, v);
        ev.run(prog);
        return ev.getOutput();
      } catch(e) {
        return 'error: ' + e.message + '\n';
      }
    }

    // Try as raw shape-lang
    try {
      const prog = parse(line);
      const ev = createEvaluator(engine);
      ev.run(prog);
      return ev.getOutput();
    } catch(e) {
      return 'error: ' + e.message + '\n';
    }
  }

  function matchPattern(pattern, path) {
    if (!pattern) return false;
    const pp = pattern.split('/'), tp = path.split('/');
    for (let i = 0; i < pp.length; i++) {
      if (pp[i].startsWith('{') && pp[i].endsWith('...}')) return i < tp.length;
      if (i >= tp.length) return false;
      if (!pp[i].startsWith('{') && pp[i] !== tp[i]) return false;
    }
    return pp.length === tp.length;
  }

  function extractPathParams(pattern, path, scope) {
    if (!pattern) return;
    const pp = pattern.split('/'), tp = path.split('/');
    for (let i = 0; i < pp.length && i < tp.length; i++) {
      if (pp[i].startsWith('{') && pp[i].endsWith('...}')) {
        scope['path_' + pp[i].slice(1, -4)] = tp.slice(i).join('/');
        return;
      }
      if (pp[i].startsWith('{') && pp[i].endsWith('}')) {
        scope['path_' + pp[i].slice(1, -1)] = tp[i];
      }
    }
  }

  function startOS(username) {
    prompt.style.display = 'none';
    osFrame.style.display = 'block';

    // Set username
    const sessionShape = engine.getShape('os.session');
    if (sessionShape) sessionShape.character.dimensions.user = username;

    // Expose to window for debugging
    window.shapeEngine = { engine, handleRequest, execShell, shapeCount: () => engine.shapeCount() };

    // Load desktop
    loadPage('/desktop');

    // Idle timeout: 30 minutes
    let idleTimer, idleWarningTimer;
    const IDLE_TIMEOUT = 30 * 60 * 1000;
    const IDLE_WARNING = 25 * 60 * 1000;

    function resetIdle() {
      clearTimeout(idleTimer);
      clearTimeout(idleWarningTimer);
      idleBar.style.display = 'none';
      idleWarningTimer = setTimeout(() => {
        idleBar.style.display = 'block';
        idleBar.textContent = 'Session expires in 5 minutes. Move your mouse or type to stay.';
      }, IDLE_WARNING);
      idleTimer = setTimeout(() => location.reload(), IDLE_TIMEOUT);
    }

    document.addEventListener('mousemove', resetIdle);
    document.addEventListener('keydown', resetIdle);
    document.addEventListener('click', resetIdle);
    resetIdle();
  }

  function loadPage(path) {
    console.log('loadPage: ' + path);
    const result = handleRequest('GET', path, '');
    console.log('loadPage result: status=' + result.status + ' body=' + result.body.length + ' chars');
    if (result.body.length < 200) console.log('body: ' + result.body);
    osFrame.srcdoc = result.body;
    osFrame.addEventListener('load', () => patchFrame(osFrame.contentWindow), { once: true });
  }

  function patchFrame(win) {
    if (!win) return;

    // Render app iframes through the shape engine instead of real URLs.
    // The desktop HTML has <iframe src="/terminal"> etc. which would 404
    // on static hosting. Replace with srcdoc rendered by the engine.
    win.document.querySelectorAll('iframe[src]').forEach(iframe => {
      const src = iframe.getAttribute('src');
      if (src && src.startsWith('/')) {
        const result = handleRequest('GET', src, '');
        if (result.status === 200) {
          iframe.removeAttribute('src');
          iframe.srcdoc = result.body;
        }
      }
    });

    // Intercept fetch
    const originalFetch = win.fetch;
    win.fetch = async function(url, options = {}) {
      let urlStr = typeof url === 'string' ? url : url.toString();
      try {
        const parsed = new URL(urlStr, win.location.href);
        if (parsed.origin !== win.location.origin && parsed.protocol !== 'blob:') return originalFetch.call(win, url, options);
        urlStr = parsed.pathname + parsed.search;
      } catch(e) {}
      const method = (options.method || 'GET').toUpperCase();
      let body = '';
      if (options.body) body = typeof options.body === 'string' ? options.body : await options.body.text();
      const result = handleRequest(method, urlStr, body);
      return new Response(result.body, { status: result.status, headers: { 'Content-Type': result.contentType } });
    };

    // Intercept link clicks
    win.document.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a || !a.href) return;
      try { const url = new URL(a.href); if (url.origin === win.location.origin) { e.preventDefault(); loadPage(url.pathname + url.search); } } catch(err) {}
    });

    // Intercept form submissions
    win.document.addEventListener('submit', (e) => {
      const form = e.target;
      if (form.method && form.method.toUpperCase() === 'POST') {
        e.preventDefault();
        const body = new URLSearchParams(new FormData(form)).toString();
        const result = handleRequest('POST', form.action || '/', body);
        osFrame.srcdoc = result.body;
      }
    });
  }
})();
</script>
</body>
</html>
