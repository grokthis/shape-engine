<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape OS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #e0e0e0; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 24px; }
#loading h1 { font-size: 28px; font-weight: 300; letter-spacing: 4px; }
#loading .status { font-size: 14px; color: #888; }
#loading .bar { width: 200px; height: 2px; background: #222; border-radius: 1px; overflow: hidden; }
#loading .bar-fill { height: 100%; background: #4af; width: 0%; transition: width 0.3s; }
#prompt-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 24px; }
#prompt-screen h2 { font-size: 20px; font-weight: 300; }
#prompt-screen input { background: #111; border: 1px solid #333; color: #e0e0e0; padding: 12px 20px; font-size: 16px; border-radius: 4px; outline: none; width: 280px; text-align: center; }
#prompt-screen input:focus { border-color: #4af; }
#prompt-screen .hint { font-size: 12px; color: #666; }
</style>
</head>
<body>
<div id="loading">
  <h1>SHAPE OS</h1>
  <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
  <div class="status" id="load-status">loading engine...</div>
</div>
<div id="prompt-screen">
  <h2>enter a username</h2>
  <input id="username" type="text" placeholder="guest" autocomplete="off" autofocus>
  <div class="hint">sandbox resets after 30 minutes of idle</div>
</div>

<script src="shape-engine.js"></script>
<script>
(async function() {
  const barFill = document.getElementById('bar-fill');
  const loadStatus = document.getElementById('load-status');
  const loading = document.getElementById('loading');
  const promptScreen = document.getElementById('prompt-screen');
  const usernameInput = document.getElementById('username');

  let engine;

  barFill.style.width = '30%';
  loadStatus.textContent = 'loading shapes...';

  try {
    engine = await bootShapeOS();
  } catch(e) {
    loadStatus.textContent = 'error: ' + e.message;
    console.error(e);
    return;
  }

  barFill.style.width = '100%';
  loadStatus.textContent = engine.shapeCount() + ' shapes loaded';

  setTimeout(() => {
    loading.style.display = 'none';
    promptScreen.style.display = 'flex';
    usernameInput.focus();
  }, 400);

  usernameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startOS(usernameInput.value.trim() || 'guest');
  });

  // --- Render a shape's content and return the output ---
  function renderShape(shapeId, scope) {
    const s = engine.getShape(shapeId);
    if (!s || !s.character.content) return '';
    try {
      const prog = parse(s.character.content);
      const ev = createEvaluator(engine);
      if (scope) for (const [k, v] of Object.entries(scope)) ev.setScope(k, v);
      ev.run(prog);
      return ev.getOutput();
    } catch(e) {
      return 'Error in ' + shapeId + ': ' + e.message;
    }
  }

  // --- Execute a shell command ---
  function execShell(line) {
    line = line.trim();
    if (!line) return '';
    if (line.includes(' | ')) {
      const segments = line.split(' | ');
      let output = '';
      for (let seg of segments) { seg = seg.trim(); if (output) seg += ' ' + output; output = execShell(seg); }
      return output;
    }
    const parts = line.split(/\s+/);
    const cmd = parts[0], argList = parts.slice(1);
    const prefix = engine.getShape('os.session.shell.prefix')?.character.content || '';
    const home = engine.getShape('os.config.shell.home')?.character.content || '';
    const cmdShape = engine.getShape('os.shell.cmd.' + cmd);
    if (cmdShape && cmdShape.character.dimensions.type === 'exec') {
      const scope = { args: argList.join(' '), line, cmd, prefix, home };
      argList.forEach((a, i) => scope['arg' + i] = a);
      return renderShape('os.shell.cmd.' + cmd, scope);
    }
    try {
      const prog = parse(line);
      const ev = createEvaluator(engine);
      ev.run(prog);
      return ev.getOutput();
    } catch(e) { return 'error: ' + e.message + '\n'; }
  }

  // --- Handle a route request through the shape engine ---
  function handleRequest(method, path) {
    let bestRoute = null, bestLen = 0;
    for (const s of engine.allShapes()) {
      if (s.character.dimensions.type !== 'route') continue;
      const rm = s.character.dimensions.method;
      if (rm && rm.toUpperCase() !== method) continue;
      const rp = s.character.dimensions.path;
      if (rp === path) { bestRoute = s; break; }
      if (matchPath(rp, path) && rp.split('/').length > bestLen) { bestRoute = s; bestLen = rp.split('/').length; }
    }
    if (!bestRoute) return '';
    const handler = engine.getShape(bestRoute.character.dimensions.handler);
    if (!handler) return '';
    const scope = { ...bestRoute.character.dimensions, method, path };
    return renderShape(handler.id, scope);
  }

  function matchPath(pattern, path) {
    if (!pattern) return false;
    const pp = pattern.split('/'), tp = path.split('/');
    for (let i = 0; i < pp.length; i++) {
      if (pp[i].startsWith('{') && pp[i].endsWith('...}')) return i < tp.length;
      if (i >= tp.length) return false;
      if (!pp[i].startsWith('{') && pp[i] !== tp[i]) return false;
    }
    return pp.length === tp.length;
  }

  // --- Start the OS: render desktop from shapes ---
  function startOS(username) {
    promptScreen.style.display = 'none';

    // The desktop handler renders the full page HTML from shapes.
    // We render it and replace the entire document body.
    const html = handleRequest('GET', '/desktop');

    if (!html) {
      document.body.innerHTML = '<pre style="padding:20px;color:#f77">Failed to render desktop. No route found for /desktop.</pre>';
      return;
    }

    // Replace document content with the shape-rendered desktop.
    document.open();
    document.write(html);
    document.close();

    // Wire the terminal if present
    wireTerminal();

    // Wire window focus
    document.querySelectorAll('.window').forEach(win => {
      win.addEventListener('mousedown', () => {
        document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
        win.classList.add('focused');
      });
    });

    // Override fetch globally so any JS in shapes routes through the engine
    const originalFetch = window.fetch;
    window.fetch = async function(url, options = {}) {
      let urlStr = typeof url === 'string' ? url : url.toString();
      if (urlStr.startsWith('/')) {
        const method = (options.method || 'GET').toUpperCase();
        const body = handleRequest(method, urlStr);
        return new Response(body, { status: body ? 200 : 404, headers: { 'Content-Type': 'text/html' } });
      }
      return originalFetch.call(window, url, options);
    };

    // Expose for debugging
    window.shapeEngine = { engine, execShell, renderShape, handleRequest };

    // Idle timeout
    let idleTimer;
    function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => location.reload(), 30 * 60 * 1000); }
    document.addEventListener('mousemove', resetIdle);
    document.addEventListener('keydown', resetIdle);
    resetIdle();
  }

  function wireTerminal() {
    const input = document.querySelector('#terminal-input') || document.querySelector('input[type="text"]');
    const output = document.querySelector('#output');
    if (!input || !output) return;

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const line = input.value;
      input.value = '';

      const cmdEl = document.createElement('div');
      cmdEl.textContent = 'shape$ ' + line;
      cmdEl.style.color = 'var(--fg-dim, #888)';
      output.appendChild(cmdEl);

      const result = execShell(line);
      if (result) {
        const outEl = document.createElement('div');
        outEl.style.whiteSpace = 'pre-wrap';
        outEl.textContent = result;
        output.appendChild(outEl);
      }
      output.scrollTop = output.scrollHeight;
    });
    input.focus();
  }
})();
</script>
</body>
</html>
